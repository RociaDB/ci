# Les dépôts fusionnent par commit de fusion : le titre de la PR passe dans son
# corps, et c'est lui que release-please lit. Déclencheur séparé de ci.yml pour
# ne pas relancer toute la CI à chaque modification du titre.
name: PR title
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
permissions: {}
jobs:
  title:
    permissions:
      pull-requests: read
    uses: RociaDB/ci/.github/workflows/_pr-title.yml@v1
