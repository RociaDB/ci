# Toute la logique vit dans RociaDB/ci. Ce fichier ne fait que la câbler.
# Dépôt PRIVÉ : remplacer ubuntu-latest par rocia2 et passer sonar à true.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  pr:
    if: github.event_name == 'pull_request'
    # Le job appelé ne peut recevoir que ce qui lui est accordé ici.
    permissions:
      contents: read
    uses: RociaDB/ci/.github/workflows/_python-quality.yml@v1
    with:
      runs_on: ubuntu-latest
      compat_versions: '[]'

  main:
    if: github.event_name == 'push'
    # L'union de ce que demandent les jobs de _python-main.yml : le job docker
    # pousse sur GHCR et signe son attestation de provenance.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: RociaDB/ci/.github/workflows/_python-main.yml@v1
    secrets: inherit
    with:
      runs_on: ubuntu-latest
      sonar: false
      publish_pypi: false    # true pour rociadb-core-sdk-python
      docker: false
      squash_tm: false
