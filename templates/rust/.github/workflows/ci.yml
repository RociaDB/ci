# Toute la logique vit dans RociaDB/ci. Ce fichier ne fait que la câbler.
# Dépôt PRIVÉ : remplacer ubuntu-latest par rocia2 et passer sonar à true.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  # Annulation sur les PR seulement. Jamais sur main : chaque push doit être vu
  # par release-please, sous peine de perdre un incrément de version.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  pr:
    if: github.event_name == 'pull_request'
    # Le job appelé ne peut recevoir que ce qui lui est accordé ici.
    permissions:
      contents: read
    uses: RociaDB/ci/.github/workflows/_rust-quality.yml@v1
    with:
      runs_on: ubuntu-latest
      # SDK publics uniquement : les runners GitHub y sont gratuits et illimités.
      compat_versions: '[]'
      # protoc: true                       # si un build.rs compile des .proto
      # postgres: postgres:18-alpine       # si les tests ont besoin d'une base
      # postgres_initdb_args: '--locale-provider=icu --icu-locale=fr-FR --encoding=UTF8'

  main:
    if: github.event_name == 'push'
    # L'union de ce que demandent les jobs de _rust-main.yml : le job docker
    # pousse sur GHCR et signe son attestation de provenance.
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: RociaDB/ci/.github/workflows/_rust-main.yml@v1
    secrets: inherit
    with:
      runs_on: ubuntu-latest
      sonar: false           # true sur un dépôt privé : l'instance est sur le tailnet
      # protoc, postgres, postgres_initdb_args : mêmes valeurs que sur le job pr
      binary_name: ''        # si le binaire ne porte pas le nom du dépôt
      publish_crate: false   # true pour rociadb-core-sdk-rust
      docker: false          # true pour un applicatif livré en image
      squash_tm: false       # true une fois l'instance Squash TM en place
      # release_type: ''     # workspace Cargo à version héritée : voir templates/rust-workspace/
