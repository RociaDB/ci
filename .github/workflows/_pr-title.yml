# Lint du titre de pull request.
#
# Les dépôts fusionnent en squash : c'est donc le TITRE de la PR qui devient le
# message de commit, et c'est lui que release-please lit pour calculer la
# prochaine version. Linter les commits de la branche ne servirait à rien.
#
# Workflow distinct du gate de qualité parce qu'il doit écouter le type `edited` :
# le mettre sur le workflow principal relancerait toute la CI à chaque
# modification du titre, inacceptable sur un runner unique.
name: pr · titre

on:
  workflow_call:
    inputs:
      runs_on:
        type: string
        default: ubuntu-latest

permissions: {}

jobs:
  pr-title:
    runs-on: ${{ inputs.runs_on }}
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            Le sujet « {subject} » doit commencer par une minuscule.
