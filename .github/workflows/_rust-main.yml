# Rust — pipeline sur main.
#
# Un seul déclencheur couvre deux situations : le push qui suit le merge d'une PR
# de dev, et le push qui suit le merge de la Release PR de release-please. C'est
# la sortie release_created qui distingue les deux — il n'y a donc pas de
# troisième workflow « release ».
name: rust · main

on:
  workflow_call:
    inputs:
      runs_on:
        description: 'Label du runner. ubuntu-latest pour les dépôts publics, rocia2 pour les privés.'
        type: string
        default: ubuntu-latest
      audit:
        description: 'Exécuter cargo-deny dans le gate de qualité.'
        type: boolean
        default: true
      protoc:
        description: "Installer protoc. Nécessaire dès qu'un build.rs compile des .proto (tonic)."
        type: boolean
        default: false
      postgres:
        description: "Image PostgreSQL à démarrer pour les tests. Vide : aucune base."
        type: string
        default: ''
      postgres_initdb_args:
        description: "POSTGRES_INITDB_ARGS de la base de test — locale, encodage."
        type: string
        default: ''
      gates_script:
        description: "Contrôles propres au dépôt, exécutés si le fichier existe."
        type: string
        default: scripts/ci-gates.sh
      sonar:
        description: "Analyser avec SonarQube. Nécessite un runner sur le tailnet — donc dépôts privés uniquement."
        type: boolean
        default: false
      publish_crate:
        description: 'Publier sur crates.io au moment du release.'
        type: boolean
        default: false
      docker:
        description: 'Construire et pousser une image multi-arch sur GHCR au moment du release.'
        type: boolean
        default: false
      binary_name:
        description: "Nom du binaire à embarquer dans l'image. Défaut : nom du dépôt."
        type: string
        default: ''
      extra_images:
        description: >-
          Images en plus, pour d'autres binaires du même dépôt : tableau JSON
          d'objets {binary, suffix, version_from, dockerfile}. Chacune est
          publiée sous ghcr.io/<organisation>/<dépôt>-<suffix>, étiquetée de la
          version lue dans le [package] du Cargo.toml « version_from » (et non
          de celle du dépôt), et jamais republiée si cette version existe déjà.
          « dockerfile » est relatif à la racine ; il copie
          dist/${TARGETARCH}/<binary>. Défaut [] : aucune image en plus.
        type: string
        default: '[]'
      image_retention:
        description: "Nombre de versions d'image taguées à conserver sur GHCR."
        type: string
        default: '10'
      squash_tm:
        description: 'Publier les résultats de tests dans Squash TM au moment du release.'
        type: boolean
        default: false
      release_environment:
        description: "Environment GitHub protégeant les publications irréversibles."
        type: string
        default: release
    secrets:
      RELEASE_APP_ID:
        required: false
      RELEASE_APP_PRIVATE_KEY:
        required: false
      SONAR_TOKEN:
        required: false
      SONAR_HOST_URL:
        required: false
      CARGO_REGISTRY_TOKEN:
        required: false
      SQUASH_TM_URL:
        required: false
      SQUASH_TM_TOKEN:
        required: false

permissions: {}

jobs:
  # Rejoue le gate sur l'état réel du trunk. Définition unique, partagée avec la PR.
  quality:
    # Un workflow appelé ne peut pas demander plus que ce que son
    # appelant lui accorde : sans cette ligne, le permissions: {} en
    # tête de fichier réduirait le gate à zéro droit.
    permissions:
      contents: read
    uses: RociaDB/ci/.github/workflows/_rust-quality.yml@v1
    with:
      runs_on: ${{ inputs.runs_on }}
      audit: ${{ inputs.audit }}
      protoc: ${{ inputs.protoc }}
      postgres: ${{ inputs.postgres }}
      postgres_initdb_args: ${{ inputs.postgres_initdb_args }}
      gates_script: ${{ inputs.gates_script }}

  sonar:
    if: ${{ inputs.sonar }}
    needs: quality
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Sonar attribue les lignes : il lui faut tout l'historique.
      - uses: actions/download-artifact@v4
        with:
          name: test-results
      - uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=rociadb_${{ github.event.repository.name }}
            -Dsonar.projectVersion=${{ github.sha }}
            -Dsonar.rust.lcov.reportPaths=coverage.lcov

  release-please:
    needs: quality
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Indispensable : une PR ouverte avec le GITHUB_TOKEN par défaut ne
      # déclenche aucun workflow, la Release PR resterait sans check et donc
      # non mergeable.
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-type: rust

  publish:
    if: ${{ needs.release-please.outputs.release_created == 'true' && inputs.publish_crate }}
    needs: release-please
    runs-on: ${{ inputs.runs_on }}
    environment: ${{ inputs.release_environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  docker:
    if: ${{ needs.release-please.outputs.release_created == 'true' && inputs.docker }}
    needs: release-please
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # Cross-compilation plutôt qu'émulation : QEMU coûte 10 à 20× sur une
      # compilation Rust, ce qui est intenable sur un runner unique. zigbuild
      # produit les deux binaires statiques nativement sur amd64.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
        if: ${{ inputs.protoc }}
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: compilation des deux architectures
        env:
          BIN: ${{ inputs.binary_name || github.event.repository.name }}
        run: |
          set -euo pipefail
          cargo zigbuild --release --locked --target x86_64-unknown-linux-musl
          cargo zigbuild --release --locked --target aarch64-unknown-linux-musl
          mkdir -p dist/amd64 dist/arm64
          cp "target/x86_64-unknown-linux-musl/release/$BIN"  dist/amd64/app
          cp "target/aarch64-unknown-linux-musl/release/$BIN" dist/arm64/app

      # Les binaires des images en plus sortent de la même compilation : cargo
      # construit tous ceux de l'espace de travail, rien n'est recompilé. Ils
      # passent par une archive tar, parce qu'un artefact perd le bit
      # d'exécution et que COPY le conserverait absent dans l'image.
      - name: binaires des images en plus
        if: ${{ fromJSON(inputs.extra_images)[0] != null }}
        env:
          EXTRA: ${{ inputs.extra_images }}
        run: |
          set -euo pipefail
          for bin in $(jq -r '.[].binary' <<<"$EXTRA"); do
            cp "target/x86_64-unknown-linux-musl/release/$bin"  "dist/amd64/$bin"
            cp "target/aarch64-unknown-linux-musl/release/$bin" "dist/arm64/$bin"
          done
          tar -cf dist-extra.tar dist
      - uses: actions/upload-artifact@v4
        if: ${{ fromJSON(inputs.extra_images)[0] != null }}
        with:
          name: dist-extra
          path: dist-extra.tar
          retention-days: 1

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          flavor: latest=false  # latest rend les déploiements Kubernetes non reproductibles
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.tag_name }}

      # Le Dockerfile ne doit contenir aucun RUN : seules des instructions COPY,
      # sinon buildx devrait émuler l'architecture étrangère et l'on reperdrait
      # tout le bénéfice de la cross-compilation.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # La purge vit ici plutôt que dans un job planifié central : l'endpoint
      # d'énumération des packages d'une organisation refuse les jetons d'App
      # (HTTP 400 sur package_type=container). Le GITHUB_TOKEN du dépôt, lui,
      # suffit pour son propre package — et c'est ici que le stockage grossit.
      - name: purge des versions non taguées
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          delete-only-untagged-versions: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: rétention des versions taguées
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: ${{ inputs.image_retention }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # Une image par entrée de extra_images, à partir des binaires du job docker.
  # Job voisin plutôt que boucle dans docker : le nombre d'images est une donnée,
  # et seule une matrice sait faire autant d'étapes que d'entrées.
  docker-extra:
    if: ${{ needs.release-please.outputs.release_created == 'true' && inputs.docker && fromJSON(inputs.extra_images)[0] != null }}
    needs: [release-please, docker]
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.extra_images) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/download-artifact@v4
        with:
          name: dist-extra
      - run: tar -xf dist-extra.tar

      # Cette image a sa propre version : celle du Cargo.toml qui la décrit.
      - name: version de l'image
        id: version
        env:
          FICHIER: ${{ matrix.image.version_from }}
          BINAIRE: ${{ matrix.image.binary }}
          SUFFIXE: ${{ matrix.image.suffix }}
          DOCKERFILE: ${{ matrix.image.dockerfile }}
        run: |
          set -euo pipefail
          [ -n "$BINAIRE" ]    || { echo "::error::extra_images : la clé « binary » manque"; exit 1; }
          [ -n "$SUFFIXE" ]    || { echo "::error::extra_images : la clé « suffix » manque"; exit 1; }
          [ -n "$FICHIER" ]    || { echo "::error::extra_images : la clé « version_from » manque"; exit 1; }
          [ -f "$DOCKERFILE" ] || { echo "::error::extra_images : le Dockerfile « $DOCKERFILE » (clé « dockerfile ») n'existe pas"; exit 1; }
          version=$(awk '
            /^\[/ { dans = ($0 ~ /^\[package\][ \t]*$/) }
            dans && /^version[ \t]*=/ { match($0, /"[^"]+"/); print substr($0, RSTART + 1, RLENGTH - 2); exit }
          ' "$FICHIER")
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$ ]]; then
            echo "::error::pas de version = \"X.Y.Z\" dans le [package] de $FICHIER (version.workspace = true n'est pas lue : l'image a sa propre version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # L'étiquette X.Y.Z est immuable : une version de l'image qui n'a pas
      # changé ne se republie pas. Seule l'absence de l'étiquette autorise le
      # push ; toute autre erreur d'inspection arrête le job.
      - name: l'étiquette existe-t-elle déjà ?
        id: existe
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-${{ matrix.image.suffix }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ref="${IMAGE,,}:$VERSION"
          if sortie=$(docker buildx imagetools inspect "$ref" 2>&1); then
            echo "$ref existe déjà : rien à pousser."
            echo "existe=true" >> "$GITHUB_OUTPUT"
          elif grep -qiE 'not found|manifest unknown|name unknown|no such manifest|denied|unauthorized' <<<"$sortie"; then
            echo "$ref n'existe pas : publication."
            echo "existe=false" >> "$GITHUB_OUTPUT"
          else
            echo "$sortie"
            exit 1
          fi

      - uses: docker/metadata-action@v5
        if: ${{ steps.existe.outputs.existe == 'false' }}
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-${{ matrix.image.suffix }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}

      # Même contrat que l'image principale : aucun RUN dans le Dockerfile.
      - uses: docker/build-push-action@v6
        if: ${{ steps.existe.outputs.existe == 'false' }}
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.suffix }}

      - name: purge des versions non taguées
        if: ${{ steps.existe.outputs.existe == 'false' }}
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: ${{ github.event.repository.name }}-${{ matrix.image.suffix }}
          package-type: container
          delete-only-untagged-versions: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: rétention des versions taguées
        if: ${{ steps.existe.outputs.existe == 'false' }}
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: ${{ github.event.repository.name }}-${{ matrix.image.suffix }}
          package-type: container
          min-versions-to-keep: ${{ inputs.image_retention }}
          token: ${{ secrets.GITHUB_TOKEN }}

  squash-tm:
    if: ${{ needs.release-please.outputs.release_created == 'true' && inputs.squash_tm }}
    needs: [quality, release-please]
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: true  # une instance Squash TM indisponible ne casse pas une release
    permissions:
      contents: read
    steps:
      # Le job quality de cette même exécution a testé exactement le commit que
      # release-please vient de taguer : son rapport JUnit fait foi, le rejouer
      # ne prouverait rien de plus et coûterait toute la mise en place.
      - uses: actions/download-artifact@v4
        with:
          name: test-results
      - uses: RociaDB/ci/actions/squash-tm-publish@v1
        with:
          report: target/nextest/ci/junit.xml
          version: ${{ needs.release-please.outputs.version }}
          squash_url: ${{ secrets.SQUASH_TM_URL }}
          squash_token: ${{ secrets.SQUASH_TM_TOKEN }}
