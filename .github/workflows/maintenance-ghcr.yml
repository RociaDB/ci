# Purge du registre GHCR.
#
# Le plan Team offre 2 Go de packages privés : 6 dépôts × 2 architectures × n
# versions les saturent sans rétention. On supprime les versions non taguées,
# qui sont des couches intermédiaires orphelines, puis on plafonne le nombre de
# versions taguées conservées.
name: maintenance · ghcr

on:
  schedule:
    - cron: '43 3 * * 0'
  workflow_dispatch:
    inputs:
      keep:
        description: 'Nombre de versions taguées à conserver par image.'
        type: string
        default: '10'

permissions: {}

jobs:
  # delete-package-versions ne sait pas cibler « tous les packages d'une
  # organisation » : il faut les énumérer d'abord.
  discover:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - id: list
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          packages=$(gh api --paginate \
            "/orgs/$OWNER/packages?package_type=container" \
            --jq '[.[].name]' | jq -sc 'add // []')
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "packages trouvés : $packages"

  purge:
    needs: discover
    if: ${{ needs.discover.outputs.packages != '[]' }}
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      # Un jeton d'App est nécessaire : le GITHUB_TOKEN de ce dépôt ne peut pas
      # supprimer les versions d'un package appartenant à un AUTRE dépôt.
      # L'App doit porter la permission « Packages : read and write ».
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: versions non taguées
        uses: actions/delete-package-versions@v5
        with:
          owner: ${{ github.repository_owner }}
          package-name: ${{ matrix.package }}
          package-type: container
          delete-only-untagged-versions: true
          token: ${{ steps.app-token.outputs.token }}

      - name: anciennes versions taguées
        uses: actions/delete-package-versions@v5
        with:
          owner: ${{ github.repository_owner }}
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: ${{ inputs.keep || '10' }}
          token: ${{ steps.app-token.outputs.token }}
