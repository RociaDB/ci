# Node / TypeScript — gate de qualité. Appelé sur PR par le stub, et sur main par _node-main.yml.
# Couvre aussi bien un package npm qu'une application Nuxt SSR.
name: node · quality

on:
  workflow_call:
    inputs:
      runs_on:
        description: 'Label du runner. ubuntu-latest pour les dépôts publics, rocia2 pour les privés.'
        type: string
        default: ubuntu-latest
      node_version:
        description: 'Version Node principale.'
        type: string
        default: '22'
      compat_versions:
        description: 'Tableau JSON de versions Node supplémentaires, ex. ["20"]. [] désactive le job compat.'
        type: string
        default: '[]'
      audit:
        description: 'Exécuter pnpm audit. Non bloquant pendant la stabilisation.'
        type: boolean
        default: true
      format:
        description: >
          Exécuter `pnpm run format:check`. false pour un dépôt sans formateur :
          l'étape est alors sautée, et le journal le montre.
        type: boolean
        default: true
      postgres:
        description: >
          Image PostgreSQL à démarrer pour les tests du job quality, ex.
          postgres:16-alpine. Vide : aucune base. Expose DATABASE_URL et les
          CI_POSTGRES_* aux tests, comme _rust-quality.yml.
        type: string
        default: ''

permissions: {}

jobs:
  quality:
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup doit précéder setup-node pour que `cache: pnpm`
      # détecte le gestionnaire et active le cache du store.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Même serveur, mêmes identifiants et mêmes variables que dans
      # _rust-quality.yml : un seul PostgreSQL pour tout le job, retiré au
      # ramassage. Voir ce fichier pour le pourquoi de chaque option.
      - name: PostgreSQL de test
        if: ${{ inputs.postgres != '' }}
        env:
          IMAGE: ${{ inputs.postgres }}
        run: |
          set -euo pipefail
          docker rm --force --volumes ci-postgres >/dev/null 2>&1 || true
          docker run --detach --name ci-postgres \
            --label rociadb.ci=true \
            --shm-size=1g \
            --env POSTGRES_PASSWORD=postgres \
            --publish 127.0.0.1:5432:5432 \
            "$IMAGE"
          for _ in $(seq 60); do
            docker exec ci-postgres pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1 && break
            sleep 1
          done
          if ! docker exec ci-postgres pg_isready -h 127.0.0.1 -U postgres; then
            docker logs ci-postgres 2>&1 | tail -n 30
            exit 1
          fi
          {
            echo "DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/postgres"
            echo "CI_POSTGRES_HOTE=127.0.0.1"
            echo "CI_POSTGRES_PORT=5432"
            echo "CI_POSTGRES_CONTENEUR=ci-postgres"
          } >> "$GITHUB_ENV"

      - name: format
        if: ${{ inputs.format }}
        run: pnpm run format:check
      - name: lint
        if: ${{ !cancelled() }}
        run: pnpm run lint
      - name: types
        if: ${{ !cancelled() }}
        run: pnpm run typecheck
      - name: tests + couverture
        if: ${{ !cancelled() }}
        run: pnpm run test:ci

      - name: audit des dépendances
        if: ${{ !cancelled() && inputs.audit }}
        continue-on-error: true
        run: pnpm audit --audit-level=high

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: |
            junit.xml
            coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7

      # --volumes : l'image postgres déclare un VOLUME, que `docker rm` seul
      # laisse sur le runner (voir _rust-quality.yml).
      - name: ramassage
        if: ${{ always() && inputs.postgres != '' }}
        run: docker rm --force --volumes ci-postgres || true

  compat:
    if: ${{ inputs.compat_versions != '[]' }}
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(inputs.compat_versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:ci
