# Rust — gate de qualité. Appelé sur PR par le stub du dépôt, et sur main par _rust-main.yml.
# Nom de job figé : quality sert de required status check.
name: rust · quality

on:
  workflow_call:
    inputs:
      runs_on:
        description: 'Label du runner. ubuntu-latest pour les dépôts publics, rocia2 pour les privés.'
        type: string
        default: ubuntu-latest
      compat_versions:
        description: 'Tableau JSON de toolchains supplémentaires, ex. ["1.85","beta"]. [] désactive le job compat.'
        type: string
        default: '[]'
      audit:
        description: 'Exécuter cargo-deny. Non bloquant pendant la stabilisation.'
        type: boolean
        default: true
      protoc:
        description: "Installer protoc. Nécessaire dès qu'un build.rs compile des .proto (tonic)."
        type: boolean
        default: false
      postgres:
        description: >
          Image PostgreSQL à démarrer pour les tests, ex. postgres:18-alpine.
          Vide : aucune base. Expose DATABASE_URL aux tests.
        type: string
        default: ''
      postgres_initdb_args:
        description: "POSTGRES_INITDB_ARGS de la base de test — locale, encodage."
        type: string
        default: ''
      gates_script:
        description: "Contrôles propres au dépôt, exécutés si le fichier existe et est exécutable."
        type: string
        default: scripts/ci-gates.sh

permissions: {}

jobs:
  quality:
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    env:
      NEXTEST_PROFILE: ci
      # Les macros sqlx interrogeraient sinon la base au moment de compiler,
      # alors que le dépôt versionne déjà ses descripteurs dans .sqlx.
      SQLX_OFFLINE: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov,cargo-deny

      # protoc est la seule dépendance de la chaîne Rust que cargo n'installe
      # pas : sans elle, un crate qui engendre du code gRPC ne compile pas.
      - uses: arduino/setup-protoc@v3
        if: ${{ inputs.protoc }}
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Un serveur unique pour toute la suite, plutôt qu'un conteneur par
      # binaire ou par test : sur un runner persistant au disque contraint,
      # c'est la différence entre un conteneur et plusieurs centaines.
      - name: PostgreSQL de test
        if: ${{ inputs.postgres != '' }}
        env:
          IMAGE: ${{ inputs.postgres }}
          INITDB_ARGS: ${{ inputs.postgres_initdb_args }}
        run: |
          set -euo pipefail
          # Identifiants laissés aux valeurs par défaut de l'image, qui sont
          # aussi celles du module postgres de testcontainers : un harnais qui
          # sait parler aux deux n'a alors qu'une adresse à changer.
          docker run --detach --name ci-postgres \
            --env POSTGRES_PASSWORD=postgres \
            --env POSTGRES_INITDB_ARGS="$INITDB_ARGS" \
            --publish 127.0.0.1:5432:5432 \
            "$IMAGE"
          for _ in $(seq 60); do
            docker exec ci-postgres pg_isready -U postgres >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec ci-postgres pg_isready -U postgres
          {
            echo "DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/postgres"
            echo "CI_POSTGRES_HOTE=127.0.0.1"
            echo "CI_POSTGRES_PORT=5432"
            echo "CI_POSTGRES_CONTENEUR=ci-postgres"
          } >> "$GITHUB_ENV"

      # Chaînés en !cancelled() : un échec de format n'empêche pas de voir
      # les erreurs de clippy et de tests dans la même exécution.
      - name: format
        run: cargo fmt --all --check
      - name: clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: tests + couverture
        if: ${{ !cancelled() }}
        run: cargo llvm-cov nextest --workspace --all-features --lcov --output-path coverage.lcov

      # Point d'extension : les critères d'arrêt propres au dépôt restent dans
      # le dépôt, le workflow ne fait que les appeler.
      - name: contrôles du dépôt
        if: ${{ !cancelled() }}
        env:
          GATES: ${{ inputs.gates_script }}
        run: |
          set -euo pipefail
          if [ -x "$GATES" ]; then
            "$GATES"
          else
            echo "aucun script de contrôles à $GATES"
          fi

      - name: audit des dépendances
        if: ${{ !cancelled() && inputs.audit }}
        continue-on-error: true
        run: |
          curl -fsSL https://raw.githubusercontent.com/RociaDB/ci/v1/config/deny.toml -o "$RUNNER_TEMP/deny.toml"
          cargo deny --config "$RUNNER_TEMP/deny.toml" check

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: |
            target/nextest/ci/junit.xml
            coverage.lcov
          if-no-files-found: warn
          retention-days: 7

      # Sur un runner persistant, un conteneur oublié survit à l'exécution.
      - name: ramassage
        if: ${{ always() && inputs.postgres != '' }}
        run: docker rm --force ci-postgres || true

  compat:
    if: ${{ inputs.compat_versions != '[]' }}
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        toolchain: ${{ fromJSON(inputs.compat_versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}
      - uses: arduino/setup-protoc@v3
        if: ${{ inputs.protoc }}
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --all-features
        env:
          SQLX_OFFLINE: 'true'
