# Vérification du jeton de la GitHub App, à la demande.
#
# Valide en une trentaine de secondes que l'App existe, qu'elle est installée
# sur l'organisation et que les deux secrets sont corrects — sans avoir à
# migrer un dépôt pour le découvrir. Resservira à chaque rotation de clé.
name: selftest · jeton d'App

on:
  workflow_dispatch:

permissions: {}

jobs:
  token:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: dépôts couverts par l'installation
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          count=$(gh api /installation/repositories --jq '.total_count')
          echo "### App installée sur $count dépôts" >> "$GITHUB_STEP_SUMMARY"
          gh api --paginate /installation/repositories \
            --jq '.repositories[].full_name' | sort | tee -a "$GITHUB_STEP_SUMMARY"
