# Configuration cargo-deny partagée par les dépôts Rust de l'organisation.
# Récupérée par _rust-quality.yml depuis la ref v1 de ce dépôt : la modifier
# ici la change pour tous les dépôts d'un coup.

[advisories]
yanked = "deny"

[licenses]
# Licences permissives acceptées sans revue. Toute autre licence fait échouer
# l'audit et demande une décision explicite.
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    # Portée par webpki-roots, qui distribue le magasin de certificats de
    # Mozilla. Ajoutée après constat, pas par précaution : cette liste est une
    # politique, et chaque entrée doit être une décision.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

# Les crates du workspace portent `publish = false` : ils ne sont pas
# distribués, et leur champ `license` peut légitimement ne pas être une
# expression SPDX (« UNLICENSED »). Seules les dépendances sont auditées.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Un crate du workspace référencé par chemin n'a pas de version : cargo-deny le
# compte comme un « * ». La règle vise les dépendances publiées dont la version
# n'est pas contrainte, pas les crates internes — sans cette ligne, tout
# workspace multi-crates échoue à l'audit dès le premier jour.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
